[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "servicepulse-operations"
version = "0.1.0"
description = "Reproducible 311 operational performance and service improvement analysis"
requires-python = ">=3.10"

[project.scripts]
servicepulse = "servicepulse.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
